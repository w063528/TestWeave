name: SBOM - TestWeave

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - develop
      - "feature/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  generate-sbom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CycloneDX tool
        run: |
          python -m pip install --upgrade pip
          pip install cyclonedx-bom

      - name: Detect dependency source
        id: detect
        shell: bash
        run: |
          if [ -f "poetry.lock" ] && [ -f "pyproject.toml" ]; then
            echo "mode=poetry" >> "$GITHUB_OUTPUT"
          elif [ -f "Pipfile.lock" ]; then
            echo "mode=pipenv" >> "$GITHUB_OUTPUT"
          elif [ -f "requirements.txt" ]; then
            echo "mode=requirements" >> "$GITHUB_OUTPUT"
          else
            echo "mode=environment" >> "$GITHUB_OUTPUT"
          fi

      - name: Install project dependencies (environment mode fallback)
        if: steps.detect.outputs.mode == 'environment'
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

      - name: Generate SBOM from Poetry
        if: steps.detect.outputs.mode == 'poetry'
        run: |
          cyclonedx-py poetry -o sbom.cdx.json

      - name: Generate SBOM from Pipenv
        if: steps.detect.outputs.mode == 'pipenv'
        run: |
          cyclonedx-py pipenv --format JSON --output-file sbom.cdx.json

      - name: Generate SBOM from requirements.txt
        if: steps.detect.outputs.mode == 'requirements'
        run: |
          cyclonedx-py requirements --format JSON --output-file sbom.cdx.json requirements.txt

      - name: Generate SBOM from Python environment
        if: steps.detect.outputs.mode == 'environment'
        shell: bash
        run: |
          source .venv/bin/activate
          cyclonedx-py environment --format JSON --output-file sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: testweave-sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "✅ SBOM 생성 완료",
              "",
              "- 포맷: CycloneDX JSON",
              "- 파일: `sbom.cdx.json`",
              `- 워크플로우 실행: ${runUrl}`
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
